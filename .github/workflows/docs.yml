name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate documentation
        run: python scripts/check_docs.py

      - name: Syntax-check Windows media builders
        run: python -m py_compile scripts/make_windows_arm64_media.py scripts/build_windows11_beyond2lte_aio.py
