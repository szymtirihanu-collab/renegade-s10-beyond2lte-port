name: Candidate beyond2lte host build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/host-build.yml"
      - "scripts/host_build.sh"
      - "scripts/audit_firmware_entry.py"
      - "UPSTREAM.lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Native ARM64 runner; this is a host-only compile, not a device flash.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out integration repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable source and dependency pins
        run: |
          python scripts/check_docs.py
          python scripts/audit_upstream_tree.py
          python scripts/audit_mu_snapshot.py

      - name: Build UEFI from pinned sources (no device connected)
        env:
          CI: "true"
        run: bash scripts/host_build.sh

      - name: Audit firmware reset vector against SEC file
        run: >-
          python scripts/audit_firmware_entry.py
          "${{ runner.temp }}/beyond2lte-host-build/Mu-Silicium/Build/beyond2ltePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Upload candidate firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beyond2lte-uefi-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/beyond2lte-host-build/Mu-Silicium/Build/beyond2ltePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            ${{ runner.temp }}/beyond2lte-host-build/Mu-Silicium/Mu-beyond2lte.img
          if-no-files-found: error
          retention-days: 7
