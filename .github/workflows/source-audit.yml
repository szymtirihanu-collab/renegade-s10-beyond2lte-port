name: Host-side source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Native ARM64 hosted runner; no local workstation required.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out this integration repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project documentation
        run: python scripts/check_docs.py
      - name: Audit pinned upstream metadata and tree
        run: python scripts/audit_upstream_tree.py
      - name: Verify UFS read-only patch applies to pinned driver source
        run: python scripts/audit_ufs_patch.py
      - name: Audit pinned USB and display source markers
        run: python scripts/audit_io_support.py
      - name: Verify SEC boot-argument capture patch
        run: python scripts/audit_sec_bootarg_patch.py
      - name: Verify Mu-Silicium reference snapshot and submodules
        run: python scripts/audit_mu_snapshot.py
